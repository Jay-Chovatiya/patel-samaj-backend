spring.application.name=patelsamaj-backend
server.port=${PORT:8080}

spring.main.lazy-initialization=true

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/PatelSamaj}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update

jwt.secret=${JWT_SECRET:sfjehfcawndawlecjwlf342nhwldwlmxkedewhndhfiwelcfsnejfd}
jwt.expiration-time=${JWT_EXPIRE:86400000}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8081}

#Email configuration
spring.mail.host=${MAIL_HOST:email_host}
spring.mail.port=${MAIL_PORT:123}
spring.mail.username=${MAIL_USERNAME:your_email}
spring.mail.password=${MAIL_PASSWORD:your_password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

#Hikari Configure
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000

